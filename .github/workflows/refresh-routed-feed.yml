name: Refresh routed feed

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC. Every source in the shared news config is fetched. A source
    # failures are reported; a majority outage preserves the existing feed.
    # A successful fetch commits the feed, including an empty article list.
    # Deployment uses the existing Pages workflow and its SEO gate.
    - cron: '15 5 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-routed-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout news routing config
        uses: actions/checkout@v6
        with:
          repository: koltregaskes/ai-resource-hub
          ref: main
          path: .news-pipeline
          persist-credentials: false
          sparse-checkout: shared/website-tools/pipelines/news
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Fetch sources and apply the Kol's Korner filter
        run: node scripts/refresh-routed-feed.mjs --pipeline .news-pipeline/shared/website-tools/pipelines/news

      - name: Commit the fetched feed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-digests/news-feed-latest.json
          if git diff --cached --quiet; then
            echo "No routed feed changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh routed news feed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push the refreshed feed
        if: steps.commit.outputs.committed == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy through the single Pages workflow
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
