name: Refresh routed feed

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC. Every source in the shared news config is fetched. A source
    # that cannot be fetched fails this run by name and leaves the file unchanged.
    # A successful fetch commits the feed, including an empty article list.
    # That same run then publishes GitHub Pages.
    - cron: '15 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-routed-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout news routing config
        uses: actions/checkout@v6
        with:
          repository: koltregaskes/ai-resource-hub
          ref: main
          path: .news-pipeline
          persist-credentials: false
          sparse-checkout: shared/website-tools/pipelines/news
          sparse-checkout-cone-mode: true

      - name: Fetch sources and apply the Kol's Korner filter
        run: node scripts/refresh-routed-feed.mjs --pipeline .news-pipeline/shared/website-tools/pipelines/news

      - name: Commit the fetched feed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-digests/news-feed-latest.json
          if git diff --cached --quiet; then
            echo "No routed feed changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh routed news feed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push the refreshed feed
        if: steps.commit.outputs.committed == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Node
        if: steps.commit.outputs.committed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Build site from markdown
        if: steps.commit.outputs.committed == 'true'
        run: node scripts/build.mjs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Pages
        if: steps.commit.outputs.committed == 'true'
        uses: actions/configure-pages@v6

      - name: Archive Pages artifact
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.[^/]* \
            .

      - name: Upload Pages artifact
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publish GitHub Pages
        id: deployment
        if: steps.commit.outputs.committed == 'true'
        uses: actions/deploy-pages@v4
