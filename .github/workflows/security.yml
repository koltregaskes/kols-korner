name: Security launch checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Scan history with redacted output only
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 git /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact=100 --exit-code 2 --no-banner --log-opts="--all -- . :(exclude)**/.env :(exclude)**/.env.* :(exclude).env :(exclude).env.*" > "$RUNNER_TEMP/secret-scan.log" 2>&1 && result=0 || result=$?
          if [ "$result" -eq 0 ]; then echo 'Secret scan: passed (redacted summary only)'; elif [ "$result" -eq 2 ]; then echo 'Secret scan: findings detected; values withheld'; exit 2; else echo "Secret scan: scanner failed, exit $result; details withheld"; exit "$result"; fi
      - name: Build public artifact for redacted scan
        run: npm run build
      - name: Scan public artifact with redacted output only
        shell: bash
        run: |
          if find site -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Artifact has excluded environment files; scan refused without opening them'
            exit 1
          fi
          docker run --rm -v "$PWD/site:/scan:ro" -v "$PWD/.gitleaksignore:/ignore:ro" zricethezav/gitleaks:v8.30.0 dir /scan --gitleaks-ignore-path /ignore --redact=100 --exit-code 2 --no-banner > "$RUNNER_TEMP/artifact-secret-scan.log" 2>&1 && result=0 || result=$?
          if [ "$result" -eq 0 ]; then echo 'Artifact secret scan: passed (redacted summary only)'; elif [ "$result" -eq 2 ]; then echo 'Artifact secret scan: findings detected; values withheld'; exit 2; else echo "Artifact secret scan: scanner failed, exit $result; details withheld"; exit "$result"; fi
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every HTML meta policy and the unapplied header proposal
        run: python scripts/check-meta-security.py
      - name: Check internal fragments, downloads and redirect safety
        run: node scripts/check-internal-links.mjs
      - name: Verify public forms/API/telemetry boundary
        run: node scripts/check-public-boundary.mjs
      - run: node scripts/check-external-links.mjs
