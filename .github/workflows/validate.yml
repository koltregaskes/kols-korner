name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_CHANNEL: msedge

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Build site from markdown
        run: npm run build
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify fixed-date news artefacts
        run: node scripts/check-news-freshness.mjs --required-date 2026-06-03

      - name: Preserve all committed digest downloads
        run: node scripts/check-digest-preservation.mjs

      - name: Setup Python for XML and SEO validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate metadata, sitemap and RSS
        run: python scripts/check-seo.py
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Verify owned links destination
        run: node scripts/owned-links.mjs

      - name: Verify routed feed and digest recovery
        run: node --test tests/*.test.mjs scripts/publish-routed-news.test.mjs
      - name: Install launch test dependencies
        run: npm ci
      - name: Verify runner-installed Edge (no browser downloads)
        run: microsoft-edge --version
      - name: Check every route at phone and desktop widths
        run: npm run test:launch -- --shard=${{ matrix.shard }}/4
      - name: Check AI discovery file
        run: test -s site/llms.txt
