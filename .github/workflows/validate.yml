name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Build site from markdown
        run: npm run build
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify fixed-date news artefacts
        run: node scripts/check-news-freshness.mjs --required-date 2026-06-03

      - name: Check story wiki pages (drafts render to a preview only)
        run: node scripts/build-stories.mjs --check --preview "$RUNNER_TEMP/story-preview"

      - name: Upload story wiki draft preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: story-wiki-preview
          path: ${{ runner.temp }}/story-preview
          retention-days: 7
          if-no-files-found: ignore
