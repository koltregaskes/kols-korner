<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Kol's Korner</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://koltregaskes.com/404.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
    <style>
        body { background: var(--color-background); color: var(--color-text); }
        .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 72vh; text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; font-weight: 800; opacity: 0.15; line-height: 1; }
        .error-title { font-size: 1.5rem; font-weight: 600; margin-top: 1rem; }
        .error-text { max-width: 28rem; margin-top: 0.75rem; font-size: 0.95rem; opacity: 0.7; line-height: 1.7; }
        .error-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
        .error-link { display: inline-flex; padding: 0.6rem 1.2rem; border-radius: 999px; font-weight: 600; font-size: 0.9rem; text-decoration: none; background: var(--color-primary); color: var(--color-btn-primary-text); }
        .error-link.secondary { background: rgba(255, 255, 255, 0.06); color: var(--color-text); border: 1px solid var(--color-card-border); }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-text">The page you're looking for doesn't exist or has been moved. Try the homepage or browse the latest posts.</p>
        <div class="error-actions">
            <a href="./" class="error-link">Back to Kol's Korner</a>
            <a href="./news/" class="error-link secondary">Open AI news</a>
            <a href="./posts/" class="error-link secondary">Browse posts</a>
        </div>
    </main>
</body>
</html>
