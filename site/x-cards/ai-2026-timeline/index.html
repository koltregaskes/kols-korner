  <meta property="og:description" content="An interactive timeline of 20 major AI model releases in 2026, with dates, makers and primary sources.">

  <meta property="og:url" content="https://koltregaskes.com/x-cards/ai-2026-timeline/">

  <style>
    :root {
      --bg: #0a0b0f;
      --panel: #12151d;
      --ink: #e7e9ef;
      --ink-dim: #b7bdc9;
      --muted: #2a3040;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --ok: #34d399;
      --warn: #f59e0b;
      --badge: #1e2330;
      --chip: #131823;
      --chip-on: #1d2331;
      --chip-border: #293043;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      color-scheme: dark;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
      /* Avoid double scrollbars inside iframes */
      overflow: hidden;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Shared skip-link pattern, kept local to preserve the standalone card's design. */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: 0;
      z-index: 1000;
      padding: 0.7rem 0.9rem;
      border-radius: 999px;
      background: #d72b2b;
      color: #fff;
      transform: translateY(-140%);
    }
    .skip-link:focus { transform: translateY(0.8rem); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      background: linear-gradient(180deg, #0d1017, #0a0b0f);
      border-bottom: 1px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .title h1 {
      font-size: 16px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .subtitle {
      color: var(--ink-dim);
      font-size: 12px;
      line-height: 1.2;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--chip-border);
      background: var(--chip);
      color: var(--ink);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: var(--chip-on); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: 0.45; cursor: default; }

    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--muted);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin: 8px 14px 6px;
    }
    .progress .bar {
      position: relative;
      flex: 1;
      height: 6px;
      background: #0f1421;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--muted);
    }
    .progress .bar span {
      position: absolute;
      top: 0; left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 140ms ease-out;
    }
    .progress .count {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--ink-dim);
      min-width: 64px;
      text-align: right;
    }

    .months {
      display: grid;
      grid-template-columns: repeat(12, minmax(32px, 1fr));
      gap: 4px;
      padding: 0 14px 8px;
      margin-top: -2px;
    }
    @media (max-width: 480px) {
      .months { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    .month {
      appearance: none;
      background: transparent;
      font-family: inherit;
      font-size: 11px;
      color: #96a0b2;
      text-align: center;
      padding: 6px 0;
      border-radius: 6px;
      border: 1px dashed #293043;
      cursor: pointer;
      user-select: none;
    }
    .month[data-has="1"] {
      border-style: solid;
      color: #c6d1e3;
    }
    .month.active {
      background: #141a26;
      border-color: var(--accent);
      color: var(--ink);
    }

    .chips {
      padding: 6px 14px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      border: 1px solid var(--chip-border);
      background: var(--chip);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }
    .chip.active {
      background: var(--chip-on);
      outline: 1px solid var(--accent);
    }

    .timeline {
      flex: 1;
      overflow: auto;
      padding: 6px 10px 10px 16px;
      scroll-behavior: smooth;
      contain: layout paint;
    }
    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--muted);
      border-left: 4px solid #2b3a55;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 6px;
    }
    .card.active {
      border-left-color: var(--accent);
      outline: 1px solid rgba(125, 211, 252, 0.2);
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--ink-dim);
      font-size: 12px;
    }
    .date {
      font-weight: 600;
      color: #d7dbea;
    }
    .badge {
      font-size: 11px;
      background: var(--badge);
      border: 1px solid var(--muted);
      padding: 3px 8px;
      border-radius: 999px;
      color: #c1c9d9;
    }
    .maker {
      font-size: 13px;
      color: #cbd3e3;
    }
    .model {
      font-size: 15px;
      font-weight: 700;
      color: #eef2ff;
    }
    .summary {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.35;
    }
    .src {
      font-size: 12px;
      color: var(--ink-dim);
    }
    .src a { color: #9acdfc; text-decoration: underline; }

    footer {
      border-top: 1px solid var(--muted);
      padding: 8px 14px 10px;
      color: var(--ink-dim);
      font-size: 11px;
      background: #0b0e15;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    footer a { color: var(--ink-dim); text-decoration: underline; }

    /* Small screens */
    @media (max-width: 430px) {
      .title h1 { font-size: 14px; }
      .subtitle { font-size: 11px; }
      .model { font-size: 14px; }
      .summary { font-size: 12px; }
      .chip { font-size: 11px; padding: 5px 9px; }
      .btn { padding: 5px 8px; font-size: 11px; }
    }

    /* Motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .timeline { scroll-behavior: auto; }
      .progress .bar span { transition: none; }
    }
  </style>
</head>
<body>
  <a href="#timeline" class="skip-link">Skip to main content</a>
  <div class="shell" id="app">
    <header>
      <div class="title">
        <h1>AI in 2026: key model releases</h1>
        <div class="subtitle">Major releases with dates, makers and primary sources.</div>
      </div>
      <div class="controls" role="group" aria-label="Step controls">
        <button class="btn" id="prevBtn" aria-label="Prev: previous item">Prev</button>
        <button class="btn" id="nextBtn" aria-label="Next item">Next</button>
      </div>
    </header>

    <div class="progress" aria-live="polite">
      <div class="bar" aria-hidden="true"><span id="progressFill" style="width:0%"></span></div>
      <div class="count"><span id="pos">1</span>/<span id="total">20</span></div>
    </div>

    <div class="months" id="months" role="navigation" aria-label="Months of 2026"></div>

    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>

    <main class="timeline" id="timeline" tabindex="0" aria-label="Timeline of releases">
      <ul class="list" id="list" role="list"></ul>
    </main>

    <footer>
      <div>Compiled 17 Oct 2026 from makers' own announcements. Dates are first public or general availability.</div>
      <div><a href="https://koltregaskes.com/" target="_blank" rel="noopener">koltregaskes.com</a></div>
    </footer>
  </div>

  <script src="../../assets/page-scripts/6706e8ef1e3cee929ef3ff93.js"></script>
</body>
</html>
